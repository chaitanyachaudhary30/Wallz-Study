# DQN Training Configurations for Modified Wallz (P1.11 / C11)

default:
  lr: 0.0001
  batch_size: 128
  gamma: 0.99
  target_update_freq: 1000
  train_freq: 4
  grad_clip: 10.0
  huber_delta: 1.0
  double_dqn: true
  dueling: false
  channels: 64
  blocks: 3
  hidden: 256
  snapshot_interval: 20000
  snapshot_pool_size: 10
  mixture: [0.5, 0.4, 0.1]
  eval_freq: 10000
  eval_matches: 20
  seed: 42
  device: "cpu"

board_3:
  board_size: 3
  rules:
    A: true
    B: true
    C: true
    K: 1
    M: 1
  total_steps: 200000
  buffer_capacity: 20000
  min_buffer_size: 1000
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 20000
  mirror_prob: 0.5
  eval_freq: 10000

board_4:
  board_size: 4
  rules:
    A: true
    B: true
    C: true
    K: 1
    M: 0
  total_steps: 500000
  buffer_capacity: 20000
  min_buffer_size: 1000
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 50000
  mirror_prob: 0.0  # Even board size: start column is asymmetric, mirror disabled
  eval_freq: 25000

board_5:
  board_size: 5
  rules:
    A: true
    B: true
    C: true
    K: 3
    M: 10
  total_steps: 2000000
  buffer_capacity: 100000
  min_buffer_size: 1000
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 200000
  mirror_prob: 0.5
  eval_freq: 50000

board_9:
  board_size: 9
  rules:
    A: true
    B: true
    C: true
    K: 3
    M: 10
  total_steps: 5000000
  buffer_capacity: 100000
  min_buffer_size: 1000
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 500000
  mirror_prob: 0.5
  eval_freq: 100000
